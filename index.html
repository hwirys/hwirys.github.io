<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <title>쿠로네 언니의 생일을 기다리며 · 10월 30일</title>
  <meta name="description" content="10월 30일, 쿠로네 언니의 생일을 함께 축하해요. 반죽이들을 위한 특별한 초대장." />
  <style>
    @font-face { font-family:'Pretendard Variable'; src:url('/fonts/pretendard-variable.woff2') format('woff2'); font-weight:45 920; font-style:normal; font-display:swap; }
    @font-face { font-family:'Gowun Dodum'; src:url('/fonts/gowun-dodum-korean.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:swap; }
    @font-face { font-family:'Gowun Batang'; src:url('/fonts/gowun-batang-invitation-v2.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:swap; }
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      background: #070c10;
      overflow: hidden;
      width: 100%;
      height: 100%;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      overscroll-behavior: none;
    }
    body { position: fixed; inset: 0; }
    /* Keep future text-entry fields usable; game labels are never selectable. */
    input, textarea, [contenteditable]:not([contenteditable="false"]),
    [contenteditable]:not([contenteditable="false"]) * {
      -webkit-user-select: text; user-select: text;
      -webkit-touch-callout: default;
    }
    img, canvas { -webkit-user-drag: none; }
    #game-container canvas, #touch-controls, #touch-controls * { touch-action: none; }
    /* Flex centering on the parent — independent of Phaser's auto-margin
       so the canvas stays centered immediately after viewport changes. */
    #game-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      /* Use dynamic viewport units when available to avoid mobile address-bar drift. */
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--party-surround, #000);
    }
    [data-party-bright="true"] #touch-hud,
    [data-party-bright="true"] #touch-hud > div:not(#threat-cue) { color:#493c37 !important; text-shadow:none !important; }
    /* Override Phaser's inline margin-left/top — flex handles centering. */
    #game-container canvas {
      display: block;
      margin: 0 !important;
      flex-shrink: 0;
      cursor: default;
    }
    #game-container canvas:active {
      cursor: pointer;
    }
    button { font: inherit; }
    #invitation-loading{position:fixed;inset:0;z-index:45;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center;background:#000;color:#bac6c2;font:14px/1.8 'Gowun Dodum','Apple SD Gothic Neo',sans-serif}
    #invitation-loading img{width:140px;height:140px;object-fit:contain}
    #invitation-loading small{font-size:12px;font-weight:400;letter-spacing:.03em;color:#8d505d}
    #invitation-loading .ended-loading{display:none}
    [data-ended-invitation="true"] #invitation-loading{background:linear-gradient(#050a0f88,#050a0fcc),url('/assets/authored/mansion-entrance-night.webp') center/cover #091316;color:#d6d9ca}
    [data-ended-invitation="true"] #invitation-loading .birthday-loading{display:none}
    [data-ended-invitation="true"] #invitation-loading .ended-loading{display:block}
    [data-ended-invitation="true"] #invitation-loading small{color:#a9b7b1}
    .reading-open #touch-controls, .reading-open #touch-hud { display: none; }
    html.reading-open, body.reading-open { touch-action: pan-y; }
    .reading-overlay {
      position: fixed; inset: 0; z-index: 1100;
      display: flex; align-items: center; justify-content: center;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      background: rgba(3, 8, 12, .88); color: #ded7c7;
      font: 16px/1.65 "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
      touch-action: pan-y;
    }
    .reading-sheet {
      width: min(100%, 720px); max-height: 100%; overflow: hidden;
      display: flex; flex-direction: column;
      background: linear-gradient(125deg, #243029, #15211c);
      border: 1px solid #73786a; border-radius: 4px;
      box-shadow: 0 22px 70px #000b;
    }
    .reading-sheet header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 12px 16px; border-bottom: 1px solid #49584b;
      flex-shrink: 0;
    }
    .reading-sheet h2 { font-size: 19px; font-weight: 600; line-height: 1.4; color: #d9c294; word-break: keep-all; overflow-wrap: anywhere; }
    .reading-sheet h3 { font-size: 18px; line-height: 1.5; margin-bottom: 10px; }
    .reading-sheet p { margin: 0 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .reading-content {
      padding: 18px; overflow-y: auto; overscroll-behavior: contain;
      min-height: 0; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    }
    #title-screen { overscroll-behavior: contain; }
    .reading-footer { padding: 0 16px 14px; flex-shrink: 0; }
    .reading-footer:empty { display: none; }
    .reading-sheet button {
      min-width: 44px; min-height: 44px; padding: 9px 12px;
      border: 1px solid #667461; border-radius: 3px;
      background: #2d3b32; color: #eee3cc; cursor: pointer;
      font-family: inherit; font-size: 15px; line-height: 1.5; touch-action: manipulation;
    }
    .reading-sheet button:active, .reading-sheet button[aria-pressed="true"] { background: #45503d; border-color: #c4a974; }
    .reading-sheet button:focus-visible { outline: 2px solid #d0b67f; outline-offset: 2px; }
    .reading-sheet .reading-close { flex-shrink: 0; font-size: 14px; }
    .reading-muted { color: #b4bdac; font-size: 14px; }
    .reading-paper {
      padding: 18px; border-left: 3px solid #a99265;
      color: #342e27; background: linear-gradient(100deg, #dbd1b9, #e9e0cd);
      font-family: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
    }
    .reading-paper p:last-child { margin-bottom: 0; }
    .reading-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
    .reading-tabs button { text-align: left; }
    .reading-evidence { padding: 12px 0; border-bottom: 1px solid #aca18b; }
    .reading-evidence:last-child { border-bottom: 0; }
    .reading-evidence strong { display: block; margin-bottom: 5px; }
    .reading-options { display: grid; gap: 8px; margin-top: 14px; }
    .reading-options button { text-align: left; }
    [data-panel="pause"] .reading-sheet { max-width: 440px; }
    [data-panel="pause"] .reading-options { margin-top: 0; }
    [data-panel="case-board"] .reading-content { display: grid; gap: 16px; align-content: start; }
    [data-panel="case-board"] .notebook-action { justify-self: start; }
    [data-panel="case-board"] .reading-evidence { padding: 16px 0; }
    [data-panel="case-board"] .reading-evidence:first-child { padding-top: 0; }
    [data-panel="case-board"] .reading-evidence:last-child { padding-bottom: 0; }
    [data-panel="archive"] .reading-footer { display: flex; flex-wrap: wrap; gap: 8px; }
    [data-panel="settings"] .reading-content h3:not(:first-child) { margin-top: 22px; }
    .reading-setting { display: grid; grid-template-columns: minmax(0, 1fr) 44px 44px; gap: 8px; align-items: center; padding: 12px 0; border-bottom: 1px solid #49584b; }
    .reading-setting[data-setting="interaction_hints"] { grid-template-columns: minmax(0, 1fr) auto; }
    .reading-setting .reading-muted { margin-top: 4px; }
    .reading-feedback { color: #d8a194; padding-top: 12px; }
    .reading-keypad { display: grid; grid-template-columns: repeat(6, minmax(44px, 1fr)); gap: 6px; margin-top: 14px; }
    .reading-keypad button { padding: 6px; font-size: 18px; }
    .reading-keypad-actions { display: flex; gap: 8px; margin-top: 12px; }
    .reading-keypad-actions button { flex: 1; }
    .reading-code { font: 26px/1.6 monospace; text-align: center; letter-spacing: 4px; padding: 10px; background: #0a1116; color: #dec995; border: 1px solid #5c655f; }
    .reading-code-display { position: sticky; top: -18px; z-index: 1; background: #152027; padding: 4px 0; }
    .reading-inventory { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
    .reading-inventory button { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:5px; min-height:116px; padding:8px 5px; font-size:14px; }
    .inventory-icon { display:block; width:72px; height:72px; max-width:100%; object-fit:contain; }
    .inventory-name { overflow-wrap:anywhere; word-break:keep-all; }
    .inventory-detail { display:flex; align-items:flex-start; gap:16px; }
    .inventory-preview { width:112px; height:112px; object-fit:contain; flex-shrink:0; background:#283b3220; border-radius:4px; }
    .inventory-detail h3 { margin-top:0; }
    .reading-content p { word-break:keep-all; overflow-wrap:anywhere; }
    @media(max-width:520px) {
      .reading-inventory { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .inventory-icon { width:64px; height:64px; }
      .inventory-detail { gap:10px; padding:12px; }
      .inventory-preview { width:72px; height:72px; }
    }
    @media(max-width:359px) { .reading-inventory { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    .reading-dialog { align-items: flex-end; background: rgba(3, 8, 12, .26); }
    .reading-dialog .reading-sheet { max-height: 65%; }
    .reading-dialog .reading-content { min-height: 86px; }
    @media (max-height: 450px) {
      .reading-code-display { position: static; }
    }
    @media (max-width: 350px) {
      .reading-content { padding: 12px; }
      .reading-keypad { grid-template-columns: repeat(5, minmax(44px, 1fr)); gap: 3px; }
      .reading-tabs { grid-template-columns: 1fr; }
    }
  </style>

</head>
<body>
  <div id="game-container"></div>
  <div id="invitation-loading" role="status"><p id="initial-birthday-clock" style="font:400 clamp(38px,8vw,82px)/1.2 monospace;letter-spacing:.08em">--:--:--</p><small>2026. 10. 30. 00:00 JST</small></div>
  <script>{const el=document.getElementById('initial-birthday-clock'),target=Date.parse('2026-10-30T00:00:00+09:00');const draw=()=>{const t=Math.max(0,Math.ceil((target-Date.now())/1000));el.textContent=[Math.floor(t/3600),Math.floor(t/60)%60,t%60].map(n=>String(n).padStart(2,'0')).join(':');};draw();const id=setInterval(()=>{if(!el.isConnected)clearInterval(id);else draw();},1000);}</script>
</body>
